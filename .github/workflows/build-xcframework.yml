name: Build MinimuxerRust XCFramework

# M1 pipeline for the Rust rewrite (branch rust-rewrite):
#   test job        -- host tests for the new crates + workspace check
#   xcframework job -- release staticlibs for device + simulator,
#                      assembled into MinimuxerRust.xcframework
#
# The legacy crate's own workflow (build.yml) is untouched.

on:
  workflow_dispatch:
  push:
    branches: [rust-rewrite]
    tags: ['rust-v*']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-xcframework.yml'
      - 'Scripts/**'
      - 'Package.swift'
      - 'Common/**'
      - 'DeviceGateway/**'
      - 'Shell/**'

jobs:
  test:
    name: Test (host) + workspace check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.4.1
        with:
          xcode-version: '16.2'

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install bindgen for aws-lc (legacy crate dependency)
        run: cargo install --force --locked bindgen-cli

      # NOTE: test scope is the new crates. The legacy root crate's tests
      # (src/tests.rs) are on-device integration tests driving a real
      # device over USB/Wi-Fi; they cannot run on a CI host and never
      # ran in this repo's CI.
      - name: Cargo test (new crates)
        run: cargo test -p mm-common -p mm-net -p mm-rp -p mm-gateway -p mm-core -p mm-emproxy -p mm-ffi

      # The libimobiledevice backend is feature-isolated (its test
      # binaries would need the C library to link); type-check it
      # on host and for the device target instead.
      - name: Cargo check (libimobiledevice backend, host)
        run: cargo check -p mm-gateway --features limd

      - name: Cargo check (whole workspace, legacy crate included)
        run: cargo check --workspace

      - name: Cargo check (iOS device target)
        run: cargo check -p mm-common -p mm-net -p mm-gateway -p mm-core -p mm-emproxy -p mm-ffi --target aarch64-apple-ios

      - name: Cargo check (iOS device target, libimobiledevice backend)
        run: cargo check -p mm-ffi --features limd --target aarch64-apple-ios

      # The Swift shell's error conversion tables are generated from
      # crates/mm-common/error-map.toml (single source of truth);
      # fail if the checked-in tables drift from it.
      - name: Error table drift check (shell)
        run: python3 Scripts/generate-error-table.py --check

  xcframework:
    name: Build MinimuxerRust.xcframework
    runs-on: macos-15
    needs: test
    # Tag builds publish a GitHub Release (see the last step);
    # the repo's default token is read-only, so grant write here.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.4.1
        with:
          xcode-version: '16.2'

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install bindgen for aws-lc (idevice dependency)
        run: cargo install --force --locked bindgen-cli

      # The shipped build enables the libimobiledevice backend;
      # its C symbols resolve when the App links (SideStore links
      # libimobiledevice for the Swift minimuxer already).
      - name: Build staticlibs (release)
        run: |
          cargo build -p mm-ffi --release --features limd --target aarch64-apple-ios
          cargo build -p mm-ffi --release --features limd --target aarch64-apple-ios-sim
          cargo build -p mm-ffi --release --features limd --target x86_64-apple-ios

      - name: Assemble XCFramework
        run: |
          set -euo pipefail
          mkdir -p build/include/minimuxer_rust
          cp crates/mm-ffi/generated/minimuxer_rust.h build/include/minimuxer_rust/
          cp crates/mm-ffi/generated/SwiftBridgeCore.h build/include/minimuxer_rust/
          printf 'module minimuxer_rust {\n\theader "minimuxer_rust.h"\n\theader "SwiftBridgeCore.h"\n\texport *\n}\n' \
            > build/include/minimuxer_rust/module.modulemap
          lipo -create \
            -output build/libminimuxer_rust-sim.a \
            target/aarch64-apple-ios-sim/release/libminimuxer_rust.a \
            target/x86_64-apple-ios/release/libminimuxer_rust.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libminimuxer_rust.a \
            -headers build/include \
            -library build/libminimuxer_rust-sim.a \
            -headers build/include \
            -output build/MinimuxerRust.xcframework
          ditto -c -k --keepParent build/MinimuxerRust.xcframework \
            build/MinimuxerRust.xcframework.zip
          shasum -a 256 build/MinimuxerRust.xcframework.zip \
            > build/MinimuxerRust.xcframework.zip.sha256
          cat build/MinimuxerRust.xcframework.zip.sha256

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimuxerRust.xcframework
          path: |
            build/MinimuxerRust.xcframework.zip
            build/MinimuxerRust.xcframework.zip.sha256
            crates/mm-ffi/generated/minimuxer_rust.swift
            crates/mm-ffi/generated/SwiftBridgeCore.swift

      # Tag builds (rust-v<semver>) publish the xcframework zip as a
      # GitHub Release asset; Common/Package.swift pins that asset by
      # URL + checksum (DESIGN section 6 release flow).
      - name: Publish Release asset (tag builds)
        if: startsWith(github.ref, 'refs/tags/rust-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "MinimuxerRust.xcframework for the Swift shell binaryTarget (DESIGN section 6)."
          gh release upload "${{ github.ref_name }}" \
            build/MinimuxerRust.xcframework.zip \
            build/MinimuxerRust.xcframework.zip.sha256 --clobber

  diag-import:
    name: Diag import test (temporary)
    runs-on: xcode-27
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '27.2'
      - name: Fetch 0.1.1 xcframework headers
        run: |
          curl -sL -o /tmp/mm.zip https://github.com/yongshuai1013/minimuxer-rust/releases/download/rust-v0.1.1/MinimuxerRust.xcframework.zip
          cd /tmp && ditto -x -k mm.zip mmx
          ls mmx/MinimuxerRust.xcframework/ios-arm64/Headers/minimuxer_rust/
      - name: Typecheck isolated references
        run: |
          INC=/tmp/mmx/MinimuxerRust.xcframework/ios-arm64/Headers
          printf 'import minimuxer_rust\nlet a = __swift_bridge__$mm_core_status\nlet b = __swift_bridge__$mm_gateway_service_port\n' > /tmp/t1.swift
          echo "=== control (status/service_port):"
          xcrun swiftc -typecheck -I "$INC" /tmp/t1.swift && echo CONTROL_OK || echo CONTROL_FAIL
          printf 'import minimuxer_rust\nlet c = __swift_bridge__$mm_core_set_params\n' > /tmp/t2.swift
          echo "=== set_params reference:"
          xcrun swiftc -typecheck -I "$INC" /tmp/t2.swift && echo SETPARAMS_OK || echo SETPARAMS_FAIL
          printf 'import minimuxer_rust\nlet d = __swift_bridge__$mm_parse_pairing_file\nlet e = __swift_bridge__$Vec_MmGatewayBackend$pop\n' > /tmp/t3.swift
          echo "=== option-enum controls:"
          xcrun swiftc -typecheck -I "$INC" /tmp/t3.swift && echo CONTROLS2_OK || echo CONTROLS2_FAIL
