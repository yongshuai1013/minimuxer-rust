# error-map.toml -- SINGLE SOURCE OF TRUTH for the minimuxer error bus.
#
# Every error case that can cross the Rust/Swift FFI boundary is listed here
# exactly once, mirroring the Swift package (yongshuai1013/minimuxer
# @714aafa3). mm-common's build.rs turns this file into the Rust-side lookup
# table (ERROR_CASES); the Swift shell's conversion table is generated from
# the same file in a later milestone, so the two sides cannot drift.
#
# Fields per case:
#   domain      -- Swift error type name (MmErrorInfo.domain)
#   code        -- Swift case name, verbatim (MmErrorInfo.code)
#   description -- Swift `description` rendering; placeholders:
#                  {reason}       the reason string payload
#                  {protocol}     PairingProtocol raw value (payload cases)
#                  {missing_keys} comma-joined missing keys (PairingError)
#                  {code}         numeric payload (EMProxyError.unknownError)
#                  {component}    MinimuxerComponent raw value (service wrapper)
#   description_empty_reason -- optional; used instead of `description`
#                  when the reason is empty (DeviceGatewayError semantics).
#
# Payload encoding across the boundary (MmErrorInfo has only
# domain/code/reason): extra payloads are encoded into `reason`:
#   MinimuxerError.invalidPairing / .mount : "<protocol>\u{1}<reason>"
#   PairingError.incomplete                : "<protocol>\u{1}<key1,key2,...>"
#   EMProxyError.unknownError              : "<i32>"
# (\u{1} = unit separator; encoding/decoding lives in mm-common::error.)

