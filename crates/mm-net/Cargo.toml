[package]
name = "mm-net"
version = "0.1.0"
edition = "2021"
description = "Minimuxer Rust rewrite: network observation, interface scanning, route-table parsing, candidate peer derivation/probing, connection management and the device endpoint (port of Swift subsystems 4/5/6)."

[dependencies]
mm-common = { path = "../mm-common" }
libc = "0.2"
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
